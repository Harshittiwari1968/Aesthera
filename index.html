<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- 🧭 This line makes your site responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🏷️ Title shown on browser tab -->
    <title>AESTHERA</title>

    <!-- 🖼️ Optional: Favicon (small icon in browser tab) -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- 🎨 Optional: Primary theme color (used in mobile browsers) -->
    <meta name="theme-color" content="#212EA0" />

    <!-- 🗒️ Description (helps with SEO) -->
    <meta
      name="description"
      content="Aesthera — A creative platform showcasing innovative projects and developers."
    />

    <!-- 🔠 Optional: Preconnect for Google Fonts (faster font loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <!-- 🧩 React mounts your app inside this div -->
    <div id="root"></div>

    <!-- ⚙️ React main entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
